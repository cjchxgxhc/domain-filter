# ╔═════════════════════════════════════════════════════════════════════════╗
# ║                         Domain Filter 配置文件                                                                            ║
# ╚═════════════════════════════════════════════════════════════════════════╝
#
# 规则类型（type）说明：
#   add            → 将规则域名并入当前集合
#   discard        → 精确移除与规则匹配的域名
#   discard_suffix → 移除被规则父域名覆盖的域名
#   match          → 仅保留与规则精确匹配的域名
#   match_suffix   → 仅保留被规则父域名覆盖的域名
#
# rules 中 source 字段支持三种写法：
#   - src_name                         → 引用 sources 中的命名源
#   - https://example.com/list.txt     → 内联 URL（mode=common, validate=true）
#   - "@group_key"                       → 引用前置规则组的处理结果
#   - url: https://...                 → 内联 URL 完整写法，可指定 mode / validate
#     mode: skip
#
# sources 支持两种写法：
#   name: https://...                  → 单行，mode=common, validate=true
#   name:                              → 完整写法，validate 默认 true
#     url: https://...
#     mode: skip | adblockwhite | common
#     validate: false                  → 仅需关闭校验时才写
#
# formats 直接写在规则组顶层，存在即启用输出，不写则不输出文件。
# 支持格式：domain hosts hostsipv6 smartdns adblock clash singbox
#           wildcard loon surge quantumultx shadowrocket
#
# dedup_subdomain（可选，与 title 同层）：
#   true  → 强制去重   false → 强制不去重   不写 → 按格式自动判断
#   domain / hosts / hostsipv6 默认不去重，其余格式默认去重


# ──────────────────────────── 全局配置 ────────────────────────────────────────

global:
  repo_url:    https://github.com/cjchxgxhc/domain-filter
  raw_base:    https://raw.githubusercontent.com/cjchxgxhc/domain-filter/refs/heads/main/data/rules
  ghproxy:     https://ghproxy.net/
  timezone:    Asia/Shanghai
  output_root: data/rules


# ──────────────────────────── 外部源定义 ──────────────────────────────────────

sources:
  src_proxy_tld:
    url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/tld-proxy.list
    mode: common
    validate: false

# ──────────────────────────── 规则组 ──────────────────────────────────────────

addata_discard:
  rules:
    - type: add
      source:
        - https://raw.githubusercontent.com/217heidai/adblockfilters/refs/heads/main/rules/white.txt
        - https://raw.githubusercontent.com/Cats-Team/AdRules/refs/heads/script/mod/rules/dns-allowlist.txt
        - https://raw.githubusercontent.com/privacy-protection-tools/dead-horse/master/anti-ad-white-list.txt
        - https://raw.githubusercontent.com/cjchxgxhc/domain-filter/refs/heads/main/data/self/ads/whitelist.txt
        - https://raw.githubusercontent.com/Potterli20/file/refs/heads/main/file-hosts/allow/Domains


addata_discard_suffix:
  rules:
    - type: add
      source:
        - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/doh-vpn-proxy-bypass-onlydomains.txt
        - https://raw.githubusercontent.com/cjchxgxhc/domain-filter/refs/heads/main/data/self/ads/whitelist.txt

ads_hosts:
  title: Ads Hosts
  description: 主要引用 217heidai/adblockfilters (lite) 项目规则，增添：手机端应用程序广告、子域名（用于hosts格式）；删除：白名单域名。
  formats: [hosts, domain]
  rules:
    - type: add
      source:
        - https://raw.githubusercontent.com/cjchxgxhc/domain-filter/refs/heads/main/data/self/ads/SMAdHosts.txt
        - https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-hosts.txt
        - https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockdnslite.txt
        - https://raw.githubusercontent.com/Cats-Team/AdRules/refs/heads/script/mod/rules/dns-rules.txt
        - https://raw.githubusercontent.com/lingeringsound/10007_auto/refs/heads/master/configure/%E8%87%AA%E5%AE%9A%E4%B9%89.prop
    - type: discard
      source: ["@addata_discard"]
    - type: discard_suffix
      source: ["@addata_discard_suffix"]
    - type: add
      source:
        - https://raw.githubusercontent.com/cjchxgxhc/domain-filter/refs/heads/main/data/self/ads/hostslist.txt


ads:
  title: Ads
  description: 主要引用 217heidai/adblockfilters (lite)、lingeringsound/10007、privacy-protection-tools/anti-AD 项目规则，增添：手机端应用程序广告、国外广告（轻量）；删除：白名单域名。
  formats: [adblock, clash, singbox, quantumultx, shadowrocket, surge, smartdns, domain, wildcard]
  rules:
    - type: add
      source:
        - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/light.txt
        - https://raw.githubusercontent.com/lingeringsound/10007/main/reward
        - https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-domains.txt
        - https://small.oisd.nl
    - type: discard
      source: ["@addata_discard"]
    - type: discard_suffix
      source: ["@addata_discard_suffix"]
    - type: add
      source: ["@ads_hosts"]


proxy:
  title: Proxy
  description: 所有需要被代理分流的域名。
  formats: [clash, singbox, quantumultx, shadowrocket, surge, domain, wildcard]
  rules:
    - type: add
      source:
        - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/proxy.list
        - https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt
        - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Global/Global_Domain.txt
        - https://raw.githubusercontent.com/LM-Firefly/Rules/refs/heads/master/PROXY.list
        - https://raw.githubusercontent.com/cjchxgxhc/domain-filter/refs/heads/main/data/self/FlClash_IP_Check.txt
        - src_proxy_tld
      domain:
        - browserleaks.net
        - browserleaks.org
        - addons.mozilla.org
        - adtidy.org
        - powerampapp.com
        - cloud.9mod.space
        - modyolo.com


direct_fix:
  title: Direct Fix
  description: 修复可能被proxy组错误分流的直连域名。
  formats: [clash, singbox, quantumultx, shadowrocket, surge, domain, wildcard]
  rules:
    - type: add
      source:
        - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/microsoft-cn.list
        - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/NTPService/NTPService.list
        - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/GoogleFCM/GoogleFCM.list
        - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/games-cn.list
        - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Notion/Notion_No_Resolve.yaml
        - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/private.list
        - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/fakeip-filter.list
      domain:
        - firefoxcn.net
        - firefox.com.cn
        - ipv4only.arpa
        - example.org
        - baidu.com
        - ntp.org
        - jsdelivr.com
        - jsdelivr.net
        - ghproxy.net
        - time.windows.com
        - outlook.com
        - login.microsoftonline.com
        - live.com
        - live.net
        - logincdn.msftauth.net
        - acctcdn.msftauth.net
        - microsofttranslator.com
        - translate.microsoft.com
        - api.cognitive.microsoft.com
        - translatoruser.intl.microsoft.com
        - edge.microsoft.com
    - type: discard_suffix
      domain: [bing.com, bing.net]
