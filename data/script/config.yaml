presets:

  p_my_ads_rule:
    custom_blacklist:
      - sentry.io
      - update.9mod.com
      - vip-ipspace-cn.heytapmobi.com
      - collector.github.com

  p_dns_bypass:
    blocklist:
      - https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/refs/heads/master/discretion/dns.txt
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/BlockHttpDNS/BlockHttpDNS.list
      - https://raw.githubusercontent.com/LM-Firefly/Rules/refs/heads/master/Special/DNS.list
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/adblock/doh.top.txt

  p_pcdn_list:
    blocklist:
      - https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/refs/heads/master/discretion/pcdn.txt
      - https://raw.githubusercontent.com/lovebai/lovebai/refs/heads/main/rule/adhome-pcdn.txt
      - https://raw.githubusercontent.com/uselibrary/PCDN/refs/heads/main/pcdn.list
      - https://raw.githubusercontent.com/4fuu/AdGuard-Home-PCDN/refs/heads/main/ban.txt
      - https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/refs/heads/main/rules/PCDNDomain.list
      
  p_cn_mobile_ads_basic:
    blocklist:
      - https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/AWAvenue-Ads-Rule.txt
      - https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockdnslite.txt
      - https://raw.githubusercontent.com/Cats-Team/dns-filter/main/abp.txt
      - https://raw.githubusercontent.com/lingeringsound/10007_auto/master/reward
    whitelist:
      - https://raw.githubusercontent.com/217heidai/adblockfilters/refs/heads/main/rules/white.txt
      - https://raw.githubusercontent.com/cjchxgxhc/domain-filter/refs/heads/main/data/self/ads_white.txt

  p_cn_mobile_ads_dangerous: # 存在误杀
    blocklist:
      - https://raw.githubusercontent.com/qq5460168/666/master/dns.txt
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/domains/native.oppo-realme.txt
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/adblock/native.xiaomi.txt
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/adblock/native.huawei.txt
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/adblock/native.vivo.txt
      - https://raw.githubusercontent.com/damengzhu/banad/refs/heads/main/dnslist.txt
      - https://raw.githubusercontent.com/Aethersailor/adblockfilters-modified/main/rules/adblockdnslite.txt
      - https://raw.githubusercontent.com/790953214/qy-Ads-Rule/refs/heads/main/black.txt
      - https://raw.githubusercontent.com/Kuroba-Sayuki/FuLing-AdRules/Master/FuLingRules/FuLingBlockList.txt
      - https://raw.githubusercontent.com/2Gardon/SM-Ad-FuckU-hosts/refs/heads/master/SMAdHosts
    whitelist:
      - https://raw.githubusercontent.com/neodevpro/neodevhost/refs/heads/master/allow
      - https://raw.githubusercontent.com/privacy-protection-tools/dead-horse/master/anti-ad-white-list.txt
      - https://raw.githubusercontent.com/qq5460168/666/refs/heads/master/allow-ublock.txt
      - https://raw.githubusercontent.com/cjchxgxhc/domain-filter/refs/heads/main/data/self/ads_white.txt

  p_ads_aboard:
    blocklist:
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/pro.plus.mini.txt
    #  - https://small.oisd.nl
    whitelist:
      # 去除部分中文域名，防止误杀
      - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/cn.list
      - https://raw.githubusercontent.com/cjchxgxhc/domain-filter/refs/heads/main/data/self/ads_white.txt
    custom_whitelist:
      - cn

  p_microsoft_cn:
    blocklist:
      - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/microsoft-cn.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/SteamCN/SteamCN_No_Resolve.yaml
      - https://ruleset.skk.moe/List/non_ip/microsoft_cdn.conf
    whitelist:
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Bing/Bing_No_Resolve.yaml
    custom_blacklist:
      - outlook.com
      # 登录
      - login.microsoftonline.com
      - live.com
      - live.net
      - logincdn.msftauth.net
      - acctcdn.msftauth.net
      # 翻译
      - microsofttranslator.com
      - translate.microsoft.com
      - api.cognitive.microsoft.com
      - translatoruser.intl.microsoft.com
      # Edge
      - edge.microsoft.com

groups:

  ads:
    title: Ads Blocklist China
    description: 针对中文移动端广告。
    use_presets:
      - p_my_ads_rule
      - p_pcdn_list
      - p_cn_mobile_ads_basic
      - p_cn_mobile_ads_dangerous
      - p_dns_bypass
    custom_whitelist:
      - yandex.net
      # 国家后缀
      - https://raw.githubusercontent.com/cjchxgxhc/domain-filter/refs/heads/main/data/self/tld-proxy.txt
    formats:
      - adblock
      - clash
      - singbox

  ads_big:
    title: Ads Blocklist Large
    description: 适用于代理程序。
    use_presets:
      - p_my_ads_rule
      - p_pcdn_list
      - p_cn_mobile_ads_basic
      - p_cn_mobile_ads_dangerous
      - p_ads_aboard
      - p_dns_bypass
    formats:
      - adblock
      - clash
      - singbox

  proxy:
    title: Proxy
    description: 需要被代理的域名。
    blocklist:
      - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/proxy.list
      - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/ai.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Microsoft/Microsoft_No_Resolve.yaml
      - https://raw.githubusercontent.com/LM-Firefly/Rules/refs/heads/master/PROXY.list
    whitelist:
      # 时间校准
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/NTPService/NTPService.list
      - https://raw.githubusercontent.com/LM-Firefly/Rules/refs/heads/master/Special/NTP-Service.list
      # 速度测试
      - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/networktest.list
      # 广告域名
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/pro.plus.mini.txt
      # 可以直连的域名
      # Notion
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Notion/Notion_No_Resolve.yaml
      # Apple
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Apple/Apple_Domain.yaml
    custom_blacklist:
      # DNS 测试
      - browserleaks.net
      - browserleaks.org
      # IP 测试
      - icanhazip.com
      - ident.me
      - ifconfig.me
      - api.ipify.org
      - checkip.amazonaws.com
      - ipinfo.io
      - ip.sb
      - ip-api.com
      - api.myip.com
      - myip.la
      - ipapi.co
      - geoip.seektor.com
      - geojs.io
      - ipgeolocation.io
      - cip.cc
      - ip.cn
      - freeapi.ipip.net
      - whoer.net
      - ipqualityscore.com
      - getipintel.net
      - ipip.net
      - upaiyun.com
      - klayer.com
      - qqwry.api.skk.moe
      - qwry.mirror.noc.one
      - qqwry-mirror.cdn.skk.moe
      - whois.pconline.com.cn
      # 国家后缀
      - https://raw.githubusercontent.com/cjchxgxhc/domain-filter/refs/heads/main/data/self/tld-proxy.txt
      # Firefox 扩展商店
      - addons.mozilla.org
      # 规则下载
      - adtidy.org
    custom_whitelist:
      # GitHub 加速
      - jsdelivr.com
      - jsdelivr.net
      - ghproxy.net
      # 时间校准
      - time.windows.com
    formats:
      - clash
      - singbox

  microsoft_cn:
    title: Microsoft China
    description: 微软直连域名。
    use_presets:
      - p_microsoft_cn
    formats:
      - clash
      - singbox

  direct_fix:
    title: Direct Fix
    description: 直连域名片段。
    use_presets:
      - p_microsoft_cn
    blocklist:
      - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/private.list
      - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/fakeip-filter.list
      # 谷歌 FCM
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/GoogleFCM/GoogleFCM.list
      # Apple China
      - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/apple-cn.list
      # 游戏
      - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/games-cn.list
    custom_blacklist:
      # 局域网
      - lan
      - local
      - localdomain
      - localhost
      # Firefox
      - firefox.com
      - firefoxcn.net
      - firefox.com.cn
      
      - ipv4only.arpa
      - example.org
      - allawntech.com
      - baidu.com
      - ntp.org
      - heytapmobi.com
      - heytapdownload.com
    formats:
      - clash
      - singbox
