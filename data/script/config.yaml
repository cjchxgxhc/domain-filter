# ╔══════════════════════════════════════════════════════════════════════════╗
# ║                         Domain Filter 配置文件                          ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# 规则类型（type）说明：
#   add            → 将规则域名并入当前集合
#   discard        → 精确移除与规则匹配的域名
#   discard_suffix → 移除被规则父域名覆盖的域名
#   match          → 仅保留与规则精确匹配的域名（discard 的反逻辑）
#   match_suffix   → 仅保留被规则父域名覆盖的域名（discard_suffix 的反逻辑）
#
# 数据来源字段：
#   url        → 下载并提取域名，支持所有格式，验证域名合法性
#   pureurl    → 下载并提取域名，支持所有格式，不严格验证
#   adblockurl → 仅识别 adblock 格式（||domain^ 或 @@||domain^）
#   domain     → 直接写入自定义域名列表
#   preset     → 引用另一个规则组的处理结果（id 必须小于当前组）
#
# 规则在 rules 列表中按顺序执行，顺序影响最终结果。


# ──────────────────────────── 全局配置 ────────────────────────────────────────

global:
  repo_url: https://github.com/cjchxgxhc/domain-filter
  raw_base: https://raw.githubusercontent.com/cjchxgxhc/domain-filter/refs/heads/main/data/rules
  output_root: data/rules
  timezone: Asia/Shanghai


# ──────────────────────────── 规则组 ──────────────────────────────────────────

p_ads_important:
  id: 1
  rules:
    - type: add
      url:
        # SM广告: https://github.com/2Gardon/SM-Ad-FuckU-hosts
        - https://raw.githubusercontent.com/cjchxgxhc/domain-filter/refs/heads/main/data/self/ads.txt
        # 秋风广告规则: https://awavenue.top/
        - https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/AWAvenue-Ads-Rule.txt
        - https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-hosts.txt
        # DNS Blocklists - OPPO 追踪域名: https://github.com/hagezi/dns-blocklists
        - https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/domains/native.oppo-realme.txt
        # hosts子域名
        - https://raw.githubusercontent.com/cjchxgxhc/domain-filter/refs/heads/main/data/self/ads_hosts.txt
    - type: discard
      url:
        - https://raw.githubusercontent.com/cjchxgxhc/domain-filter/refs/heads/main/data/self/ads_white.txt
  output:
    enabled: true


p_ads_white:
  id: 2
  rules:
    - type: add
      url:
        - https://raw.githubusercontent.com/217heidai/adblockfilters/refs/heads/main/rules/white.txt
        - https://raw.githubusercontent.com/Cats-Team/AdRules/refs/heads/script/mod/rules/dns-allowlist.txt
        # anti-ad: https://github.com/privacy-protection-tools/anti-AD
        - https://raw.githubusercontent.com/cjchxgxhc/self/refs/heads/main/rules/domains.txt
        # - https://raw.githubusercontent.com/qq5460168/666/refs/heads/master/allow-ublock.txt
        - https://raw.githubusercontent.com/lingeringsound/10007_auto/refs/heads/master/Adaway_white_list.prop
        - https://raw.githubusercontent.com/cjchxgxhc/domain-filter/refs/heads/main/data/self/ads_white.txt
  output:
    enabled: true


p_ads_basic:
  id: 3
  rules:
    - type: add
      url:
        - https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockdomainlite.txt
        # 自动更新去广告 hosts: https://github.com/lingeringsound/10007_auto
        - https://raw.githubusercontent.com/lingeringsound/10007_auto/refs/heads/master/configure/%E8%87%AA%E5%AE%9A%E4%B9%89.prop
        - https://raw.githubusercontent.com/Cats-Team/dns-filter/main/abp.txt
    - type: discard
      preset:
        - p_ads_white
    - type: discard_suffix
      url:
        - https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/wildcard/nsfw.txt
        - https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/wildcard/tif.txt
    - type: add
      preset:
        - p_ads_important
    - type: discard_suffix
      url:
        - https://raw.githubusercontent.com/cjchxgxhc/domain-filter/refs/heads/main/data/self/ads_not_useful.txt
      preset:
        - p_proxy_tld
  output:
    enabled: true


p_proxy_tld:
  id: 0
  rules:
    - type: add
      pureurl:
        - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/tld-proxy.list
    - type: discard
      domain:
        - cn
        - com
        - com.cn
        - nl
        - co
        - io
        - xxx
  output:
    enabled: true


ads_big:
  id: 1000
  rules:
    - type: add
      url:
        # 自动更新去广告 hosts: https://github.com/lingeringsound/10007_auto
        - https://raw.githubusercontent.com/lingeringsound/10007_auto/master/all
        - https://raw.githubusercontent.com/lingeringsound/10007/main/all
        # anti-AD: https://github.com/privacy-protection-tools/anti-AD
        - https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-clash.yaml
        - https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-domains.txt
        # AdRules: https://github.com/Cats-Team/AdRules
        - https://raw.githubusercontent.com/Cats-Team/AdRules/main/adrules_domainset.txt
    - type: discard
      preset:
        - p_ads_white
    - type: discard_suffix
      preset:
        - p_proxy_tld
      url:
        - https://raw.githubusercontent.com/notracking/hosts-blocklists-scripts/master/domains.dead.txt
    - type: add
      preset:
        - p_ads_basic
        - p_ads_important
  output:
    enabled: true
    title: Ads Blocklist
    description: 优秀规则源的合并，尽量避免误杀。
    formats: [adblock, clash, singbox]

ads_hosts:
  id: 1001
  rules:
    - type: add
      url:
        - https://raw.githubusercontent.com/neodevpro/neodevhost/refs/heads/master/host
        - https://raw.githubusercontent.com/StevenBlack/hosts/refs/heads/master/hosts
        - https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/hosts/ultimate.txt
        - https://raw.githubusercontent.com/r-a-y/mobile-hosts/master/AdguardDNS.txt
        - https://raw.githubusercontent.com/jerryn70/GoodbyeAds/master/Hosts/GoodbyeAds.txt
        - https://hblock.molinero.dev/hosts
       # - https://github.com/Potterli20/file/releases/download/ad-hosts-pro/ad-domains.txt
        - https://raw.githubusercontent.com/cjchxgxhc/domain-filter/refs/heads/main/data/self/hosts_data.txt
      preset:
        - ads_big
    - type: match_suffix
      preset:
        - p_ads_basic
    - type: add
      preset:
        - p_ads_basic
        - p_ads_important
  output:
    enabled: true
    title: Ads Blocklist Hosts
    description: 系统级去广告。
    formats: [hosts]

proxy:
  id: 2000
  rules:
    - type: add
      url:
        - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/proxy.list
        - https://raw.githubusercontent.com/LM-Firefly/Rules/refs/heads/master/PROXY.list
        - https://raw.githubusercontent.com/cjchxgxhc/domain-filter/refs/heads/main/data/self/FlClash_IP_Check.txt
      domain:
        # DNS 测试
        - browserleaks.net
        - browserleaks.org
        # Firefox 扩展商店（国内IP限制扩展安装）
        - addons.mozilla.org
        # 规则下载
        - adtidy.org
        # Poweramp（国内IP禁止访问）
        - powerampapp.com
        # 国内缓慢
        - cloud.9mod.space
        - modyolo.com
      preset:
        - p_proxy_tld
  output:
    enabled: true
    title: Proxy
    description: 需要被代理的域名。
    formats: [clash, singbox]


direct_fix:
  id: 2001
  rules:
    - type: add
      url:
        # 微软中国
        - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/microsoft-cn.list
        # 时间校准
        - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/NTPService/NTPService.list
        # - https://raw.githubusercontent.com/LM-Firefly/Rules/refs/heads/master/Special/NTP-Service.list
        # 谷歌 FCM
        - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/GoogleFCM/GoogleFCM.list
        # Apple China
        # - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/apple-cn.list
        # 游戏
        - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/games-cn.list
        # Notion（代理环境同步不稳定）
        - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Notion/Notion_No_Resolve.yaml
      pureurl:
        - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/private.list
        - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/fakeip-filter.list
      domain:
        # Firefox
        - firefoxcn.net
        - firefox.com.cn
        # 常见
        - ipv4only.arpa
        - example.org
        - baidu.com
        - ntp.org
        # GitHub 加速
        - jsdelivr.com
        - jsdelivr.net
        - ghproxy.net
        # 时间校准
        - time.windows.com
        # 邮箱
        - outlook.com
        # 登录
        - login.microsoftonline.com
        - live.com
        - live.net
        - logincdn.msftauth.net
        - acctcdn.msftauth.net
        # 翻译
        - microsofttranslator.com
        - translate.microsoft.com
        - api.cognitive.microsoft.com
        - translatoruser.intl.microsoft.com
        # Edge
        - edge.microsoft.com
    # bing 不应进直连修复列表，按后缀移除
    - type: discard_suffix
      domain:
        - bing.com
        - bing.net
  output:
    enabled: true
    title: Direct Fix
    description: 不应被代理的域名。
    formats: [clash, singbox]

