presets:

  p_ads_white:
    blocklist:
      - https://raw.githubusercontent.com/217heidai/adblockfilters/refs/heads/main/rules/white.txt
      - https://raw.githubusercontent.com/cjchxgxhc/domain-filter/refs/heads/main/data/self/ads_white.txt
    whitelist:
      - https://raw.githubusercontent.com/cjchxgxhc/domain-filter/refs/heads/main/data/self/ads.txt#domain
      
  p_ads_basic: # 只包含极少有误杀的源
    blocklist:
      - https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/AWAvenue-Ads-Rule.txt#adblock
      - https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockdomainlite.txt#domain
      - https://raw.githubusercontent.com/Cats-Team/dns-filter/main/abp.txt#adblock

  p_ads_dangerous: # 存在误杀
    blocklist:
      - https://raw.githubusercontent.com/lingeringsound/10007/main/reward#hosts
      - https://raw.githubusercontent.com/lingeringsound/10007_auto/master/reward#hosts
      - https://raw.githubusercontent.com/qq5460168/666/master/dns.txt#adblock
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/domains/native.oppo-realme.txt#domain
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/domains/native.xiaomi.txt#domain
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/domains/native.huawei.txt#domain
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/domains/native.vivo.txt#domain
      - https://raw.githubusercontent.com/Aethersailor/adblockfilters-modified/main/rules/adblockdomainlite.txt#domain
    whitelist:
      # 严格白名单
      - https://raw.githubusercontent.com/neodevpro/neodevhost/refs/heads/master/allow#domain
      - https://raw.githubusercontent.com/qq5460168/666/refs/heads/master/allow-ublock.txt#domain

  p_ads_aboard:
    blocklist:
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/pro.mini.txt#adblock

  p_direct_fix:
    blocklist:
      # 微软中国
      - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/microsoft-cn.list#proxy
      # 时间校准
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/NTPService/NTPService.list#proxy
     # - https://raw.githubusercontent.com/LM-Firefly/Rules/refs/heads/master/Special/NTP-Service.list#proxy
     # - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/private.list#proxy
      # fakeip
      - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/fakeip-filter.list#proxy
      # 谷歌 FCM
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/GoogleFCM/GoogleFCM.list#proxy
      # Apple China
     # - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/apple-cn.list#proxy
      # 游戏
      - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/games-cn.list#proxy
      # Notion 代理环境同步不稳定
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Notion/Notion_No_Resolve.yaml#proxy
    custom_blocklist:
      # 局域网
      - lan
      - local
      - localdomain
      - localhost
      - exampe
      - direct
      # Firefox
      - firefoxcn.net
      - firefox.com.cn
      # 常见
      - ipv4only.arpa
      - example.org
      - baidu.com
      - ntp.org
      # GitHub 加速
      - jsdelivr.com
      - jsdelivr.net
      - ghproxy.net
      # 时间校准
      - time.windows.com
      # 邮箱
      - outlook.com
      # 登录
      - login.microsoftonline.com
      - live.com
      - live.net
      - logincdn.msftauth.net
      - acctcdn.msftauth.net
      # 翻译
      - microsofttranslator.com
      - translate.microsoft.com
      - api.cognitive.microsoft.com
      - translatoruser.intl.microsoft.com
      # Edge
      - edge.microsoft.com
    custom_whitelist:
      - bing.com
      - bing.net

  p_proxy:
    blocklist:
      - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/proxy.list#proxy
      - https://raw.githubusercontent.com/LM-Firefly/Rules/refs/heads/master/PROXY.list#proxy 
      - https://raw.githubusercontent.com/cjchxgxhc/domain-filter/refs/heads/main/data/self/FlClash_IP_Check.txt#domain
    custom_blocklist:
      # DNS 测试
      - browserleaks.net
      - browserleaks.org
      # Firefox 扩展商店 国内IP限制扩展安装
      - addons.mozilla.org
      # 规则下载
      - adtidy.org
      # Poweramp 国内IP禁止访问
      - powerampapp.com
      # 国内缓慢
      - cloud.9mod.space
      - modyolo.com

  p_proxy_tld:
    blocklist:
      # 国家后缀
      - https://raw.githubusercontent.com/cjchxgxhc/domain-filter/refs/heads/main/data/self/tld-proxy.txt#domain


groups:

  ads:
    title: Ads Blocklist China
    description: 针对中国地区，屏蔽广告联盟、应用广告、日志收集，包含限制应用功能的域名，建议有经验的用户使用。
    use_presets_blocklist:
      - p_ads_basic
      - p_ads_dangerous
    use_presets_whitelist:
      - p_ads_white
      - p_proxy_tld
    formats:
      - adblock
      - clash
      - singbox
      - hosts
      - domains

  ads_big:
    title: Ads Blocklist Big
    description: 额外添加了国外维护的规则源，建议用于代理程序。
    use_presets_blocklist:
      - p_ads_basic
      - p_ads_dangerous
      # 国外规则
      - p_ads_aboard
    use_presets_whitelist:
      - p_ads_white
    formats:
      - adblock
      - clash
      - singbox

  proxy:
    title: Proxy
    description: 需要被代理的域名。
    use_presets_blocklist:
      - p_proxy
      - p_proxy_tld
    formats:
      - clash
      - singbox

  direct_fix:
    title: Direct Fix
    description: 不应被代理的域名。
    use_presets_blocklist:
      - p_direct_fix
    formats:
      - clash
      - singbox
