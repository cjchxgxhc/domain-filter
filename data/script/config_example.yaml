# ==============================================================================
# Domain Filter 参考配置
# 文件路径：data/script/config.yaml
# 项目地址：https://github.com/cjchxgxhc/domain-filter
# ==============================================================================
#
# 配置结构概览
# ─────────────────────────────────────────────────────────────────────────────
# 顶层由多个"规则组"组成，每个规则组是一个任意命名的键（cfg_key）。
# 只要顶层值是 dict 且包含 rules 字段，即被识别为规则组。
#
# 处理流程：按各规则组的 id 从小到大依次处理，组内再按 rule 的数字键升序执行。
# 每条 rule 对当前域名集合执行一次操作（并入 / 过滤），最终输出到文件。
#
# ┌─规则组（cfg_key）
# │  id        整数，决定处理顺序，同时也是 preset 引用的依据
# │  enabled   是否启用此规则组（默认 true）
# │  rules     本组的规则列表（字典，键为数字字符串，按数字大小升序执行）
# │  └─ rule
# │       type      操作类型（默认 blocklist）
# │       url       下载并提取域名的链接（严格验证域名格式）
# │       pureurl   同上，但跳过域名格式验证（适用于含新式 TLD 等宽松场景）
# │       domain    直接内联的自定义域名列表（不验证）
# │       preset    引用其他规则组的最终结果（只能引用 id 更小的组）
# └─ output   输出配置
#      enabled     是否生成输出文件（默认 false）
#      title       规则集标题（同时作为文件头注释；留空则不写注释）
#      description 规则集描述（可选）
#      formats     输出格式列表（见下方格式说明）
#
# ==============================================================================
# 输出格式（formats 可选值）
# ─────────────────────────────────────────────────────────────────────────────
#   domains   纯域名列表，每行一个（domains.txt）
#   hosts     Hosts 文件格式，0.0.0.0 前缀（hosts.txt）
#   adblock   AdBlock Plus 格式，||domain^（adblock.txt）
#   clash     Clash / Mihomo payload 格式，+.domain（clash.yaml）
#   singbox   Sing-box / SRS 格式，domain_suffix 数组（singbox.json）
#
#   注：domains / hosts 保留全部精确条目；
#       adblock / clash / singbox 会额外执行子域去重（父域覆盖子域）。
#
# ==============================================================================
# URL 格式提示（在链接末尾追加 #格式名，强制指定解析方式）
# ─────────────────────────────────────────────────────────────────────────────
#   #domain   每行视为一个裸域名，直接收录（去注释后原样保留）
#   #adblock  只用严格 adblock 正则提取（||domain^），过滤所有其他行
#   #hosts    自动识别，与不加提示时行为相同（保留作为显式声明）
#   #proxy    同上（等价于通用解析模式）
#
#   不加提示时，脚本自动识别行格式：
#     ||domain^          → adblock 格式
#     DOMAIN,domain,...  → Clash 规则格式（DOMAIN / DOMAIN-SUFFIX / HOST / HOST-SUFFIX）
#     +.domain / *.domain / .domain → 前缀格式
#     0.0.0.0 domain     → hosts 格式
#     裸域名             → 直接收录
#
# ==============================================================================
# url 与 pureurl 的区别
# ─────────────────────────────────────────────────────────────────────────────
#   url      提取后调用 is_valid_domain() 严格验证：
#              · 必须符合 RFC 标准域名格式（字母/数字/连字符/点）
#              · 必须包含点号、长度不超过 253 字符、各段合法
#              · 自动支持各种规则格式（adblock / Clash / hosts / 裸域名等）
#
#   pureurl  跳过 is_valid_domain() 验证，过滤方式改为字符集检测：
#              · 域名的合法字符仅为 [a-z  0-9  -  .]，行中出现任何其他字符即丢弃
#              · 这一条覆盖了所有常见无效行类型，无需逐一枚举：
#                  adblock 行（含 | ^ @ $）  Clash 规则（含 , 空格）
#                  完整 URL（含 ://）        文件路径（含 / \）
#                  JSON/YAML（含 { } [ ] "）  含空格的行
#                  IPv6 地址（含 :）         通配符行（含 *）
#              · 字符检测无法拦截的两类场景，用补充规则处理：
#                  IPv4 地址（192.168.1.1 字符合法，但四段纯数字格式不是域名）
#                  纯数字行（端口、ASN 等，无点，亦不是域名）
#              · 前缀格式（+.domain / *.domain / .domain）仍会主动剥离前缀
#              · 适合来源可信、包含新式 TLD 或宽松格式的规则文件
#
# ==============================================================================
# rule type（操作类型）
# ─────────────────────────────────────────────────────────────────────────────
#   blocklist        将本条 rule 的域名并入当前集合（取并集）
#   whitelist        从当前集合中精确移除与白名单完全相同的域名（精确匹配）
#   whitelist_suffix 从当前集合中移除被白名单父域覆盖的所有子域（Trie 匹配）
#                    示例：白名单含 google.com → 移除 mail.google.com、
#                          www.google.com 等所有子域
#
# ==============================================================================
# preset（引用其他规则组的结果）
# ─────────────────────────────────────────────────────────────────────────────
#   - 填写目标规则组的 cfg_key（即顶层键名）
#   - 只能引用 id 更小的规则组（必须已被处理并缓存）
#   - 引用的是目标组处理完毕后的最终域名集合（包含所有 rule 累积的结果）
#   - 常见用途：在已有基础规则集上追加去重、叠加白名单过滤等
#
# ==============================================================================


# ──────────────────────────────────────────────────────────────────────────────
# 规则组 1：广告拦截基础列表
# 作用：收集多个广告域名规则源，合并去重后输出
# 本组 id=10，将被规则组 2 通过 preset 引用
# ──────────────────────────────────────────────────────────────────────────────
ad_base:
  id: 10
  # enabled: true 时处理并缓存此组，false 时完全跳过（默认 true）
  enabled: true

  rules:
    # ── rule "1"：从多个来源并入广告域名（blocklist，默认值可省略 type）──────
    "1":
      # type 默认为 blocklist，此处显式写出以作演示
      type: blocklist

      # url：下载并严格验证域名格式
      url:
        # 通用格式（不加 # 提示）：脚本自动识别行格式
        - https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt

        # #adblock：强制只用严格 adblock 正则（||domain^）提取，忽略其他行
        - https://easylist.to/easylist/easylist.txt#adblock

        # #domain：每行直接视为裸域名，原样收录（去注释后不做格式识别）
        - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/pro.txt#domain

        # #hosts：显式声明为 hosts 格式（与不加提示效果相同）
        - https://somehost.example.com/hosts.txt#hosts

      # pureurl：跳过域名格式验证，但仍过滤 IP、路径、规则关键字等明显无效行
      # 适用于含新式 TLD 或私有域名、不需要严格校验的来源
      pureurl:
        - https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-domains.txt
        # 同样支持 # 格式提示
        - https://example.com/rules.txt#adblock

      # domain：直接内联自定义域名，不经过任何验证，直接加入集合
      domain:
        - ads.example.com
        - tracker.example.net
        - telemetry.example.org

    # ── rule "2"：精确白名单过滤（从已有集合中移除完全匹配的域名）────────────
    "2":
      type: whitelist

      url:
        - https://raw.githubusercontent.com/nicholasstephan/allow-list/main/allowlist.txt

      # 内联白名单：精确移除这些域名
      domain:
        - cdn.example.com      # 此域名从黑名单中精确移除
        - api.example.com      # 仅移除该域名本身，子域不受影响

    # ── rule "3"：子域名白名单过滤（父域覆盖所有子域）──────────────────────────
    "3":
      type: whitelist_suffix

      # 白名单含 google.com → 移除集合中所有 *.google.com 及 google.com 本身
      domain:
        - google.com
        - apple.com
        - microsoft.com

  # output：控制是否生成输出文件及文件格式
  output:
    # enabled 默认 false，必须显式设为 true 才会生成文件
    enabled: true
    # title 用于文件头注释；留空（或省略）则不写注释头
    title: "广告拦截基础列表"
    # description 可选，写入文件头注释
    description: "合并多源广告域名规则，精准去重"
    # formats 列表，可同时输出多种格式
    formats:
      - domains   # → data/rules/ad_base/domains.txt   （简单去重）
      - hosts     # → data/rules/ad_base/hosts.txt      （简单去重）
      - adblock   # → data/rules/ad_base/adblock.txt   （子域去重）
      - clash     # → data/rules/ad_base/clash.yaml     （子域去重）
      - singbox   # → data/rules/ad_base/singbox.json   （子域去重）


# ──────────────────────────────────────────────────────────────────────────────
# 规则组 2：广告拦截扩展列表
# 作用：在基础列表（ad_base）之上追加更多规则源，演示 preset 的用法
# 本组 id=20 > ad_base 的 id=10，因此可以引用 ad_base
# ──────────────────────────────────────────────────────────────────────────────
ad_extended:
  id: 20
  enabled: true

  rules:
    # ── rule "1"：通过 preset 引入基础列表的完整结果 ──────────────────────────
    "1":
      type: blocklist

      # preset：引用 ad_base 处理完毕后的全部域名（含其所有 rule 的累积结果）
      # 值为目标规则组的顶层键名（cfg_key），只能引用 id 更小的组
      preset:
        - ad_base   # 将 ad_base 的最终结果并入本组

      # 可与 url / pureurl / domain 同时使用，一起并入当前集合
      url:
        - https://raw.githubusercontent.com/cjchxgxhc/domain-filter/main/data/rules/ad_base/domains.txt#domain

      domain:
        - extra-ad.example.com

    # ── rule "2"：在扩展列表上再叠加一次白名单过滤 ───────────────────────────
    "2":
      type: whitelist_suffix

      domain:
        - github.com      # 移除 github.com 及其所有子域
        - jsdelivr.net    # 移除 jsdelivr.net 及其所有子域

  output:
    enabled: true
    title: "广告拦截扩展列表"
    description: "在基础列表之上追加额外规则，覆盖更多广告域名"
    formats:
      - domains
      - adblock
      - clash
      - singbox


# ──────────────────────────────────────────────────────────────────────────────
# 规则组 3：仅用于缓存，不输出文件
# 作用：作为中间缓存层供其他组引用，本身不生成任何文件
# output.enabled 默认 false，省略整个 output 节点效果相同
# ──────────────────────────────────────────────────────────────────────────────
# cache_only_example:
#   id: 5
#   enabled: true
#   rules:
#     "1":
#       type: blocklist
#       url:
#         - https://example.com/some-list.txt
#   # 省略 output 或将 enabled 设为 false，均不生成文件
#   # output:
#   #   enabled: false
