name: Domain Filter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 00:00 运行
  workflow_dispatch:

env:
  MIHOMO_VERSION: 1.19.12  # Mihomo 版本

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 允许推送文件到仓库
      pull-requests: write # 允许操作 Pull Request
      actions: write       # 允许删除 workflow 运行记录

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史以便提交

      - name: Clean previous files
        run: |
          # 清理之前的 OUTPUT 目录和 README.md 文件
          rm -rf OUTPUT
          rm -f README.md
          echo "已清理之前的 OUTPUT 目录和 README.md 文件"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests aiohttp  # 添加 aiohttp 依赖以支持异步下载

      - name: Run filter script
        run: |
          python filter.py
        continue-on-error: false  # 脚本失败时停止工作流

      - name: Download and setup Mihomo
        run: |
          wget https://github.com/MetaCubeX/mihomo/releases/download/v${{ env.MIHOMO_VERSION }}/mihomo-linux-amd64-v${{ env.MIHOMO_VERSION }}.gz
          gzip -d mihomo-linux-amd64-v${{ env.MIHOMO_VERSION }}.gz
          chmod +x mihomo-linux-amd64-v${{ env.MIHOMO_VERSION }}
          mv mihomo-linux-amd64-v${{ env.MIHOMO_VERSION }} mihomo

      - name: Convert Clash YAML to MRS
        run: |
          for yaml_file in OUTPUT/*/clash.yaml; do
            if [ -f "$yaml_file" ]; then
              mrs_file="${yaml_file%.yaml}.mrs"
              ./mihomo convert-ruleset domain yaml "$yaml_file" "$mrs_file"
              if [ -f "$mrs_file" ]; then
                echo "成功转换：$mrs_file"
              else
                echo "错误：无法生成 $mrs_file" >&2
                exit 1
              fi
            fi
          done

      - name: Clean up Mihomo
        run: |
          rm -rf mihomo*

      - name: Verify generated files
        run: |
          # 检查 OUTPUT 目录是否存在且包含文件
          if [ ! -d "OUTPUT" ]; then
            echo "错误：OUTPUT 目录未生成" >&2
            exit 1
          fi
          # 检查 README.md 是否生成
          if [ ! -f "README.md" ]; then
            echo "错误：README.md 未生成" >&2
            exit 1
          fi
          # 列出生成的文件
          echo "生成的文件列表："
          find OUTPUT -type f -name "*.txt" -o -name "*.yaml" -o -name "*.mrs" | sort
          echo "README.md 已生成"

      - name: Commit and push all changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          # 添加所有 OUTPUT 目录下的文件（包括子目录）
          git add OUTPUT/ || echo "OUTPUT 目录为空或不存在"
          # 添加根目录的 README.md
          git add README.md || echo "README.md 未生成"
          
          # 检查是否有变更
          if git diff --staged --quiet; then
            echo "没有文件变更，跳过提交"
            exit 0
          else
            # 显示将要提交的文件
            echo "将要提交的文件："
            git diff --staged --name-only
            echo ""
            # 提交变更
            git commit -m "更新域名过滤规则和 MRS 文件 [自动生成 - $(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push origin main
            echo "成功推送变更到 main 分支"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old Workflow Runs
        if: always()  # 无论成功或失败都执行
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 1
