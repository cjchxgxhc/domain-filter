name: Update

on:
  schedule:
    - cron: '0 21 * * *'  # 每天 05:00 更新
  workflow_dispatch:

env:
  MIHOMO_VERSION: 1.19.3
  SINGBOX_VERSION: 1.11.0
  TOOLS_DIR: data/tools

jobs:
  build:
    name: Build Rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml -q

      - name: Create tools directory
        run: |
          mkdir -p ${{ env.TOOLS_DIR }}
          echo "✓ Tools directory created"

      - name: Check if tools exist
        id: check_tools
        run: |
          if [ -f "${{ env.TOOLS_DIR }}/mihomo" ] && [ -f "${{ env.TOOLS_DIR }}/sing-box" ]; then
            echo "tools_exist=true" >> $GITHUB_OUTPUT
            echo "✓ Tools already exist locally"
          else
            echo "tools_exist=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Tools not found, will download"
          fi

      - name: Download Mihomo binary
        if: steps.check_tools.outputs.tools_exist == 'false'
        run: |
          echo "Downloading Mihomo v${{ env.MIHOMO_VERSION }}..."
          cd ${{ env.TOOLS_DIR }}
          wget -q --timeout=30 https://github.com/MetaCubeX/mihomo/releases/download/v${{ env.MIHOMO_VERSION }}/mihomo-linux-amd64-v${{ env.MIHOMO_VERSION }}.gz
          gzip -d mihomo-linux-amd64-v${{ env.MIHOMO_VERSION }}.gz
          mv mihomo-linux-amd64-v${{ env.MIHOMO_VERSION }} mihomo
          chmod +x mihomo
          cd -
          echo "✓ Mihomo v${{ env.MIHOMO_VERSION }} ready"

      - name: Download sing-box binary
        if: steps.check_tools.outputs.tools_exist == 'false'
        run: |
          echo "Downloading sing-box v${{ env.SINGBOX_VERSION }}..."
          cd ${{ env.TOOLS_DIR }}
          wget -q --timeout=30 https://github.com/SagerNet/sing-box/releases/download/v${{ env.SINGBOX_VERSION }}/sing-box-${{ env.SINGBOX_VERSION }}-linux-amd64.tar.gz
          tar xzf sing-box-${{ env.SINGBOX_VERSION }}-linux-amd64.tar.gz
          mv sing-box-${{ env.SINGBOX_VERSION }}-linux-amd64/sing-box .
          chmod +x sing-box
          rm -f sing-box-${{ env.SINGBOX_VERSION }}-linux-amd64.tar.gz
          rm -rf sing-box-${{ env.SINGBOX_VERSION }}-linux-amd64/
          cd -
          echo "✓ sing-box v${{ env.SINGBOX_VERSION }} ready"

      - name: Clean old output
        run: |
          rm -rf data/rules README.md

      - name: Run script
        run: |
          python data/script/filter.py
          echo "✓ Filter script completed"

      - name: Convert MRS
        run: |
          count=0
          for file in data/rules/*/clash.yaml; do
            if [ -f "$file" ]; then
              ${{ env.TOOLS_DIR }}/mihomo convert-ruleset domain yaml "$file" "${file%.yaml}.mrs"
              count=$((count + 1))
              echo "  ✓ Converted: ${file##*/}"
            fi
          done
          echo "✓ Converted $count files to MRS format"

      - name: Convert SRS
        run: |
          count=0
          for file in data/rules/*/singbox.json; do
            if [ -f "$file" ]; then
              ${{ env.TOOLS_DIR }}/sing-box rule-set compile -o "${file%.json}.srs" "$file"
              count=$((count + 1))
              echo "  ✓ Compiled: ${file##*/}"
            fi
          done
          echo "✓ Compiled $count files to SRS format"

      - name: Check for changes
        id: check_changes
        run: |
          git add data/rules/ data/tools/ README.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✓ Changes detected"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update rules, rule-sets & tools $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
          echo "✓ Changes committed and pushed"

      - name: Cleanup old workflow
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const daysToKeep = 3;
            const runsToKeep = 2;
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - daysToKeep);
            
            console.log(`🧹 Cleaning workflow runs older than ${daysToKeep} days, keeping at least ${runsToKeep} recent runs`);
            
            try {
              const { data: workflows } = await github.rest.actions.listRepoWorkflows({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              
              let totalDeleted = 0;
              
              for (const workflow of workflows.workflows) {
                const { data: runs } = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflow.id,
                  per_page: 100
                });
                
                const sortedRuns = runs.workflow_runs.sort((a, b) => 
                  new Date(b.created_at) - new Date(a.created_at)
                );
                
                for (let i = runsToKeep; i < sortedRuns.length; i++) {
                  const run = sortedRuns[i];
                  const runDate = new Date(run.created_at);
                  
                  if (runDate < cutoffDate) {
                    try {
                      await github.rest.actions.deleteWorkflowRun({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        run_id: run.id
                      });
                      totalDeleted++;
                      console.log(`  ✓ Deleted run ${run.id} (${run.name}) from ${run.created_at}`);
                    } catch (error) {
                      console.log(`  ✗ Failed to delete run ${run.id}: ${error.message}`);
                    }
                  }
                }
              }
              
              console.log(`✓ Cleanup completed. Deleted ${totalDeleted} workflow run(s)`);
            } catch (error) {
              console.error(`❌ Cleanup failed: ${error.message}`);
            }
