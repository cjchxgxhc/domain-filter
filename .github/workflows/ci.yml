name: Update Domain Filter Rules

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * *'   # 北京 12:00
  workflow_dispatch:

env:
  MIHOMO_VERSION: 1.19.3
  SINGBOX_VERSION: 1.11.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean old files
        run: |
          rm -rf OUTPUT README.md

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Run generator
        run: python filter.py

      - name: Download Mihomo
        run: |
          wget -q https://github.com/MetaCubeX/mihomo/releases/download/v${{ env.MIHOMO_VERSION }}/mihomo-linux-amd64-v${{ env.MIHOMO_VERSION }}.gz
          gzip -d mihomo-linux-amd64-v${{ env.MIHOMO_VERSION }}.gz
          chmod +x mihomo-linux-amd64-v${{ env.MIHOMO_VERSION }}
          mv mihomo-linux-amd64-v${{ env.MIHOMO_VERSION }} mihomo

      - name: Convert to .mrs (Mihomo)
        run: |
          for f in OUTPUT/*/clash.yaml; do
            [ -f "$f" ] || continue
            ./mihomo convert-ruleset domain yaml "$f" "${f%.yaml}.mrs"
          done

      - name: Download sing-box
        run: |
          wget -q https://github.com/SagerNet/sing-box/releases/download/v${{ env.SINGBOX_VERSION }}/sing-box-${{ env.SINGBOX_VERSION }}-linux-amd64.tar.gz
          tar xzf sing-box-${{ env.SINGBOX_VERSION }}-linux-amd64.tar.gz
          mv sing-box-${{ env.SINGBOX_VERSION }}-linux-amd64/sing-box .
          chmod +x sing-box

      - name: Compile to .srs (sing-box)
        run: |
          for f in OUTPUT/*/singbox.json; do
            [ -f "$f" ] || continue
            ./sing-box rule-set compile -o "${f%.json}.srs" "$f"
          done

      - name: Cleanup binaries
        run: rm -f mihomo sing-box *.gz *.tar.gz

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OUTPUT/ README.md || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update rules & rule-sets $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Cleanup old runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 3
          keep_minimum_runs: 2
