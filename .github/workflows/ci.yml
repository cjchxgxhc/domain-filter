name: Update

on:
  schedule:
    - cron: '0 21 * * 0'  # 周日 05:00 CST 更新
  workflow_dispatch:

env:
  MIHOMO_VERSION:   1.19.3
  SINGBOX_VERSION:  1.11.0
  TOOLS_DIR:        data/tools
  RULE_BRANCH:      rule

jobs:
  build:
    name: Build Rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write

    steps:
      # ── 检出（只检出脚本/配置所在的主分支，不带规则数据）────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── Python 依赖 ───────────────────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install requests pyyaml -q

      # ── 创建工具目录 ──────────────────────────────────────────────────────────
      - name: Create tools directory
        run: mkdir -p ${{ env.TOOLS_DIR }}

      # ── 检查 mihomo / sing-box 是否已存在 ──────────────────────────────────
      - name: Check existing tools
        id: check_tools
        run: |
          if [ -f "$GITHUB_WORKSPACE/${{ env.TOOLS_DIR }}/mihomo" ]; then
            echo "mihomo_ok=true"  >> $GITHUB_OUTPUT
            echo "✓ mihomo 已存在"
          else
            echo "mihomo_ok=false" >> $GITHUB_OUTPUT
            echo "ℹ️ mihomo 不存在，将下载"
          fi

          if [ -f "$GITHUB_WORKSPACE/${{ env.TOOLS_DIR }}/sing-box" ]; then
            echo "singbox_ok=true"  >> $GITHUB_OUTPUT
            echo "✓ sing-box 已存在"
          else
            echo "singbox_ok=false" >> $GITHUB_OUTPUT
            echo "ℹ️ sing-box 不存在，将下载"
          fi

      # ── 下载 mihomo ───────────────────────────────────────────────────────────
      - name: Download Mihomo binary
        if: steps.check_tools.outputs.mihomo_ok == 'false'
        run: |
          cd ${{ env.TOOLS_DIR }}
          wget -q --timeout=60 \
            https://github.com/MetaCubeX/mihomo/releases/download/v${{ env.MIHOMO_VERSION }}/mihomo-linux-amd64-v${{ env.MIHOMO_VERSION }}.gz
          gzip -d mihomo-linux-amd64-v${{ env.MIHOMO_VERSION }}.gz
          mv mihomo-linux-amd64-v${{ env.MIHOMO_VERSION }} mihomo
          chmod +x mihomo
          echo "✓ Mihomo v${{ env.MIHOMO_VERSION }} 就绪"

      # ── 下载 sing-box ──────────────────────────────────────────────────────────
      - name: Download sing-box binary
        if: steps.check_tools.outputs.singbox_ok == 'false'
        run: |
          cd ${{ env.TOOLS_DIR }}
          wget -q --timeout=60 \
            https://github.com/SagerNet/sing-box/releases/download/v${{ env.SINGBOX_VERSION }}/sing-box-${{ env.SINGBOX_VERSION }}-linux-amd64.tar.gz
          tar xzf sing-box-${{ env.SINGBOX_VERSION }}-linux-amd64.tar.gz
          mv sing-box-${{ env.SINGBOX_VERSION }}-linux-amd64/sing-box .
          chmod +x sing-box
          rm -f  sing-box-${{ env.SINGBOX_VERSION }}-linux-amd64.tar.gz
          rm -rf sing-box-${{ env.SINGBOX_VERSION }}-linux-amd64/
          echo "✓ sing-box v${{ env.SINGBOX_VERSION }} 就绪"

      # ── 1. 运行主过滤脚本 ──────────────────────────────────────────────────────
      # 不再预先 rm -rf data/rules：产物最终只会与 rule 分支现有内容做 rsync --delete
      # 同步，没变化的文件天然不会出现在 commit 里；组被禁用/删除时会被自动清理。
      - name: Run filter.py
        run: |
          python data/script/filter.py
          echo "✓ filter.py 完成"

      # ── 2. 转换 MRS（Clash Meta Ruleset）────────────────────────────────────
      - name: Convert MRS
        run: |
          count=0
          for file in data/rules/*/clash.yaml; do
            [ -f "$file" ] || continue
            ${{ env.TOOLS_DIR }}/mihomo convert-ruleset domain yaml \
              "$file" "${file%.yaml}.mrs" \
              && count=$((count + 1)) \
              && echo "  ✓ ${file}"
          done
          echo "✓ 转换 $count 个 MRS 文件"

      # ── 3. 编译 SRS（Sing-box Rule Set）─────────────────────────────────────
      - name: Compile SRS
        run: |
          count=0
          for file in data/rules/*/singbox.json; do
            [ -f "$file" ] || continue
            ${{ env.TOOLS_DIR }}/sing-box rule-set compile \
              -o "${file%.json}.srs" "$file" \
              && count=$((count + 1)) \
              && echo "  ✓ ${file}"
          done
          echo "✓ 编译 $count 个 SRS 文件"

      # ── 4. 把产物同步到独立的 rule 分支并提交 ─────────────────────────────────
      # rule 分支只放生成结果（data/rules + README.md），主分支只放脚本/配置/
      # 缓存的工具二进制，两者互不干扰；rsync --delete 让 git diff 只反映真实
      # 内容变化，组被禁用/删除时旧目录也会被自动清理，无需在脚本里额外维护。
      - name: Sync rules to rule branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          RULE_DIR="$RUNNER_TEMP/rule-branch"
          rm -rf "$RULE_DIR"
          REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads "$REMOTE_URL" "${{ env.RULE_BRANCH }}" >/dev/null 2>&1; then
            git clone --depth 1 --branch "${{ env.RULE_BRANCH }}" "$REMOTE_URL" "$RULE_DIR"
          else
            git clone --depth 1 "$REMOTE_URL" "$RULE_DIR"
            git -C "$RULE_DIR" checkout --orphan "${{ env.RULE_BRANCH }}"
            git -C "$RULE_DIR" rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p "$RULE_DIR/data"
          rsync -a --delete data/rules/ "$RULE_DIR/data/rules/"
          cp README.md "$RULE_DIR/README.md"

          cd "$RULE_DIR"
          git add -A
          if git diff --staged --quiet; then
            echo "ℹ️ 规则内容无变更，跳过提交"
          else
            git commit -m "chore: update rules $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:"${{ env.RULE_BRANCH }}"
            echo "✓ 已提交并推送到 ${{ env.RULE_BRANCH }} 分支"
          fi

      # ── 5. 主分支只提交缓存的工具二进制（脚本/配置改动由人工提交）───────────
      - name: Check tool cache changes
        id: check_changes
        run: |
          git add ${{ env.TOOLS_DIR }} 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 工具缓存无变更"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✓ 检测到工具缓存变更"
          fi

      - name: Commit tool cache
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git commit -m "chore: cache mihomo/sing-box binaries $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
          echo "✓ 已提交并推送"

      # ── 清理旧 Workflow 记录 ──────────────────────────────────────────────────
      - name: Cleanup old workflow runs
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const daysToKeep = 3;
            const runsToKeep = 2;
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - daysToKeep);

            const { data: workflows } = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo:  context.repo.repo,
            });

            let deleted = 0;
            for (const wf of workflows.workflows) {
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                workflow_id: wf.id,
                per_page:    100,
              });
              const sorted = runs.workflow_runs.sort(
                (a, b) => new Date(b.created_at) - new Date(a.created_at)
              );
              for (let i = runsToKeep; i < sorted.length; i++) {
                if (new Date(sorted[i].created_at) < cutoff) {
                  try {
                    await github.rest.actions.deleteWorkflowRun({
                      owner:  context.repo.owner,
                      repo:   context.repo.repo,
                      run_id: sorted[i].id,
                    });
                    deleted++;
                  } catch (_) {}
                }
              }
            }
            console.log(`✓ 清理完成，删除 ${deleted} 条 Workflow 记录`);
